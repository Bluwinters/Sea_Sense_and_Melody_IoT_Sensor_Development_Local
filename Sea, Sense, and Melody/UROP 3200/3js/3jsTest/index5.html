<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Three.js - Load .GLTF with Animation</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }
        #c {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Style and position the overlay */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none; /* Allows mouse clicks to pass through to the 3D canvas controls */
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        #overlay h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }
        #overlay p {
            margin: 6px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Text Overlay Container -->
    <div id="overlay">
        <h3>Live AI & Sensor Data</h3>
        <p><strong>Prediction:</strong> <span id="prediction">-</span></p>
        <p><strong>Confidence:</strong> <span id="confidence">-</span></p>
        <p><strong>Sound Energy:</strong> <span id="sound_energy">-</span></p>
        <p><strong>Brightness:</strong> <span id="brightness">-</span></p>
        <p><strong>Color:</strong> <span id="colorValue">-</span></p>
    </div>
<script type="importmap">{
    "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/"
    }
}</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

function main() {
    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas, alpha: true });

    const fov = 45;
    const aspect = 2;
    const near = 0.1;
    const far = 100;
    const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
    camera.position.set(0, 10, 20);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 5, 0);
    controls.update();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

{
    const color = 0xFFFFFF; 
    const intensity = 8; 
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(0, 20, 0); 
    scene.add(light);
    scene.add(light.target); 
}

{
    const color =  0xFFFFE0;
    const intensity = 5;
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(0, -20, 0); 
    scene.add(light);
    scene.add(light.target); 
}


{
    const color = 0xFFFFFF; 
    const intensity = 3; 
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(20, 0, 20); 
    scene.add(light);
    scene.add(light.target); 
}

{
    const color = 0xFFFFFF; 
    const intensity = 3; 
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(-20, 0, -20); 
    scene.add(light);
    scene.add(light.target); 
}


    let mixer;
    let modelRoot;
    let currentColor;
    let currentNodeIndex = 0;

    const gltfLoader = new GLTFLoader();
    const modelparts =[];
    gltfLoader.load('models/fafaani9.gltf', (gltf) => {
        const root = gltf.scene;
        modelRoot = root;
        scene.add(modelRoot);

        root.traverse((child) => {
        if (child.isMesh) {
            //Instance a material for this child alone
            child.material = child.material.clone();
            child.material.transparent = true;

            child.material.emissive = child.material.color;
            child.material.emissiveMap = child.material.map;
            child.material.emissiveIntensity = 0.2;

            modelparts.push(child);
        }    
    });

        mixer = new THREE.AnimationMixer(root);
        gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopOnce, 1); 
            action.play();
        });

        const box = new THREE.Box3().setFromObject(root);
        const boxSize = box.getSize(new THREE.Vector3()).length();
        const boxCenter = box.getCenter(new THREE.Vector3());
        frameArea(boxSize * 0.5, boxSize, boxCenter, camera);
        controls.maxDistance = boxSize * 10;
        controls.target.copy(boxCenter);
        controls.update();
    });

    const socketProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${socketProtocol}//${location.host}/ws/game`);
    
    const predEl = document.getElementById('prediction');
    const confEl = document.getElementById('confidence');
    const soundEl = document.getElementById('sound_energy');
    const brightEl = document.getElementById('brightness');
    const colEl = document.getElementById('colorValue');

    // Listen for messages from the python backend on the virtual machine
    socket.addEventListener('message', (event) =>{
        try{
            const message = JSON.parse(event.data);
            // Check if the message has the expected structure
            if (message.type === 'SENSOR_DATA' && typeof message.color === 'string' && typeof message.sound_energy == 'number' && typeof message.brighttness === 'number' && typeof message.prediction === 'string' && typeof message.confidence === 'number') {
                
                // Update the overlay text with the received data
                predEl.textContent = message.prediction;
                confEl.textContent = (message.confidence * 100).toFixed(1) + '%'; // formatted as percentage
                soundEl.textContent = message.sound_energy.toFixed(2);
                brightEl.textContent = message.brightness.toFixed(2);
                colEl.textContent = message.color;
                colEl.style.color = message.color; // optional: color code text to match
                
                //Skip if modelparts is empty
                if (modelparts.length > 0) {
                //Index of the current mesh to update
                const currentMesh = modelparts[currentNodeIndex];

                currentMesh.material.color.set(message.color);
                currentMesh.material.emissive.set(message.color);

                currentMesh.material.emissiveIntensity = message.brightness;
                currentNodeIndex = (currentNodeIndex + 1) % modelparts.length; // Loop through the model parts
                }
            }


            
        } catch (error){
            console.error('Invalid color message', error);
        }
    });
 
    socket.addEventListener('close', () => {
        console.warn('WebSocket disconnected. Reconnecting in 2 seconds...');
        setTimeout(connectWebSocket, 2000); // Auto-reconnect after 2 seconds
    });

    socket.addEventListener('error', (error) => {
        console.error('WebSocket error:', error);
        socket.close();
    });
 
 
    function frameArea(sizeToFitOnScreen, boxSize, boxCenter, camera) {
        const halfSizeToFitOnScreen = sizeToFitOnScreen * 0.5;
        const halfFovY = THREE.MathUtils.degToRad(camera.fov * 0.5);
        const distance = halfSizeToFitOnScreen / Math.tan(halfFovY);
        const direction = (new THREE.Vector3())
            .subVectors(camera.position, boxCenter)
            .multiply(new THREE.Vector3(1, 0, 1))
            .normalize();
        camera.position.copy(direction.multiplyScalar(distance).add(boxCenter));
        camera.near = boxSize / 100;
        camera.far = boxSize * 100;
        camera.updateProjectionMatrix();
        camera.lookAt(boxCenter.x, boxCenter.y, boxCenter.z);
    }

    function resizeRendererToDisplaySize(renderer) {
        const canvas = renderer.domElement;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
            renderer.setSize(width, height, false);
        }
        return needResize;
    }

    function render() {
        if (resizeRendererToDisplaySize(renderer)) {
            const canvas = renderer.domElement;
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
        }


        if (mixer) {
            const delta = clock.getDelta();
            mixer.update(delta);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }

    const clock = new THREE.Clock();
    requestAnimationFrame(render);
}

main();
</script>
</body>
</html>
